<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The home page cursor. Nose at (7, 7), which is the hotspot the CSS
       declares. Colours are the gold-dim / night / ink tokens as fixed hex,
       because a cursor image cannot read a CSS variable; the light halo keeps
       it visible on the dark page. -->
  <g transform="translate(17 17) rotate(45)">
    <path d="M-14 0 Q0 -17 14 0 Q0 17 -14 0 Z" fill="none" stroke="#F1F7FB" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M-14 0 Q0 -17 14 0 Q0 17 -14 0 Z" fill="#D4A000" stroke="#131F24" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-8.6 -4.6 Q-9.8 0 -8.6 4.6 M8.6 -4.6 Q9.8 0 8.6 4.6" fill="none" stroke="#F1F7FB" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-4.6 0 H4.6 M-3 -2.2 V2.2 M0 -2.2 V2.2 M3 -2.2 V2.2" stroke="#F1F7FB" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
