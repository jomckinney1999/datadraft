<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Over anything clickable: the same ball, thrown — turf speed lines
       trail behind it. Same nose, same (7, 7) hotspot, so the point you click
       never moves between the two. -->
  <path d="M21 29 L27 23 M25 30 L30 25 M17 28 L20 25" stroke="#131F24" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M21 29 L27 23 M25 30 L30 25 M17 28 L20 25" stroke="#58CC02" stroke-width="1.8" stroke-linecap="round"/>
  <g transform="translate(15.5 15.5) rotate(45)">
    <path d="M-12 0 Q0 -15 12 0 Q0 15 -12 0 Z" fill="none" stroke="#F1F7FB" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M-12 0 Q0 -15 12 0 Q0 15 -12 0 Z" fill="#FFC800" stroke="#131F24" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-7.4 -4 Q-8.4 0 -7.4 4 M7.4 -4 Q8.4 0 7.4 4" fill="none" stroke="#F1F7FB" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-4 0 H4 M-2.6 -2 V2 M0 -2 V2 M2.6 -2 V2" stroke="#131F24" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
