<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- DataDraft avatar. A football whose laces are a rising bar chart, on the
       site's charcoal field with the turf glow and broadcast rays the card
       art uses. Everything that matters sits inside a centred circle of
       radius ~200, so a circular crop (X, GitHub, Slack, Vercel) loses only
       background. Shapes only, no text, so it renders the same everywhere
       and still reads at 32px. Colours are the palette tokens as hex:
       night #131F24, turf #58CC02, ice #1CB0F6, gold #FFC800, gold-dim
       #D4A000, ink #F1F7FB. -->
  <defs>
    <radialGradient id="pool" cx="256" cy="262" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58CC02" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#58CC02" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#58CC02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="-96" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC800"/>
      <stop offset="1" stop-color="#D4A000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#131F24"/>
  <rect width="512" height="512" fill="url(#pool)"/>

  <!-- Broadcast rays, as behind every picture on the site. -->
  <g fill="#58CC02" opacity="0.08">
    <path d="M256 262 L786 216 L786 308 Z"/>
    <path d="M256 262 L-274 216 L-274 308 Z"/>
    <path d="M256 262 L302 -268 L210 -268 Z"/>
    <path d="M256 262 L302 792 L210 792 Z"/>
    <path d="M256 262 L744 -52 L700 -106 Z"/>
    <path d="M256 262 L-232 576 L-188 630 Z"/>
    <path d="M256 262 L-188 -106 L-232 -52 Z"/>
    <path d="M256 262 L700 630 L744 576 Z"/>
  </g>

  <!-- Yard lines under it, fading out. -->
  <g stroke="#F1F7FB" stroke-width="3" opacity="0.07">
    <path d="M40 408 H472"/>
    <path d="M70 440 H442"/>
    <path d="M110 468 H402"/>
  </g>

  <!-- Shadow on the turf. -->
  <ellipse cx="256" cy="400" rx="132" ry="16" fill="#0B1418" opacity="0.7"/>

  <g transform="translate(256 256) rotate(-28)">
    <!-- The ball. -->
    <path d="M-158 0 Q0 -196 158 0 Q0 196 -158 0 Z" fill="url(#leather)" stroke="#131F24" stroke-width="11" stroke-linejoin="round"/>
    <path d="M-96 -50 Q-30 -82 44 -78" fill="none" stroke="#F1F7FB" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <!-- End seams. -->
    <path d="M-98 -54 Q-112 0 -98 54 M98 -54 Q112 0 98 54" fill="none" stroke="#F1F7FB" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- The laces are the chart: four bars rising off the lace line. Upright
       rather than tilted with the ball, so it reads as a chart first. -->
  <g transform="translate(256 262)">
    <path d="M-64 36 H66" stroke="#131F24" stroke-width="16" stroke-linecap="round"/>
    <path d="M-64 36 H66" stroke="#F1F7FB" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#131F24" stroke-width="6" stroke-linejoin="round">
      <rect x="-58" y="4" width="22" height="32" rx="4" fill="#F1F7FB"/>
      <rect x="-26" y="-20" width="22" height="56" rx="4" fill="#1CB0F6"/>
      <rect x="6" y="-44" width="22" height="80" rx="4" fill="#F1F7FB"/>
      <rect x="38" y="-70" width="22" height="106" rx="4" fill="#58CC02"/>
    </g>
  </g>
</svg>
